services:
  system-manager:
    build: .
    ports:
      - "4000:4000"
    container_name: system-manager
    # Run as the invoking user so files the app writes into the mounted
    # folder_organizer checkout (tag plans, proposals, exports) stay owned by
    # you instead of root. The organizer is mounted rw because it writes there.
    # The access code under ./data is chmod 0600 by the app itself, so it is
    # still only readable by this uid.
    user: "${UID:-1000}:${GID:-1000}"
    pid: host
    # docker-default's D-Bus rule denies nmcli's system-bus handshake with
    # "An AppArmor policy prevents this sender from sending this message", so
    # profile activation can never succeed under the default profile. This
    # loosens a security boundary: the container keeps pid: host and
    # network_mode: host anyway, so confinement is already partial. Drop this
    # line and NetworkManager actions go back to failing closed.
    security_opt:
      - apparmor=unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /run/user:/run/user:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /sys/class/dmi:/sys/class/dmi:ro
      # Holds the access code and the audit/inventory databases. Override this
      # line to store them somewhere else; the container needs it to be writable
      # or no one can log in.
      - ./data:/data
      # The Folder Organizer module runs in-process from its own checkout, which
      # is never copied into the image. This is the sibling project the loader
      # already looks for, so a relative path keeps the two in step. Mounted rw
      # because the app writes proposals, tag plans and exports into its own
      # data/ and commands_to_run/ -- it only ever reads the media library.
      - ../folder_organizer:/folder_organizer
    environment:
      # Auth is on unless a local .env explicitly opts out. Compose reads .env
      # from this directory for interpolation, so dropping DISABLE_AUTH=1 in
      # there still works, but a missing or untracked .env can never silently
      # expose the dashboard. Nothing is contacted without a session.
      - DISABLE_AUTH=${DISABLE_AUTH:-0}
      - HOST_ROOT=/host
      # The socket is mounted from the host at /var/run/dbus, and /var/run is a
      # symlink to /run inside the image, so the path nmcli must use is
      # /run/dbus/system_bus_socket. The old /host/run/dbus/... value pointed
      # into a prefix that only carries /proc, /sys and /etc -- nothing under
      # /host/run exists, so the address never resolved.
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
      - SYSTEM_MANAGER_AUTH_TOKEN_PATH=${SYSTEM_MANAGER_AUTH_TOKEN_PATH:-/data/access-code}
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN
      - CAP_DAC_READ_SEARCH
    restart: unless-stopped