services:
  system-manager:
    build: .
    container_name: system-manager
    network_mode: host
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /run/user:/run/user:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /sys/class/dmi:/sys/class/dmi:ro
      # Holds the access code and the audit/inventory databases. Override this
      # line to store them somewhere else; the container needs it to be writable
      # or no one can log in.
      - ./data:/data
      # The Folder Organizer module runs in-process from its own checkout, which
      # is never copied into the image. This is the sibling project the loader
      # already looks for, so a relative path keeps the two in step. Mounted rw
      # because the app writes proposals, tag plans and exports into its own
      # data/ and commands_to_run/ -- it only ever reads the media library.
      - ../folder_organizer:/folder_organizer
    environment:
      # Auth is on unless a local .env explicitly opts out. Compose reads .env
      # from this directory for interpolation, so dropping DISABLE_AUTH=1 in
      # there still works, but a missing or untracked .env can never silently
      # expose the dashboard. Nothing is contacted without a session.
      - DISABLE_AUTH=${DISABLE_AUTH:-0}
      - HOST_ROOT=/host
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/host/run/dbus/system_bus_socket
      - SYSTEM_MANAGER_AUTH_TOKEN_PATH=${SYSTEM_MANAGER_AUTH_TOKEN_PATH:-/data/access-code}
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN
      - CAP_DAC_READ_SEARCH
    restart: unless-stopped