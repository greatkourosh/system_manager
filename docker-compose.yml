services:
  system-manager:
    build: .
    ports:
      - "4000:4000"
    container_name: system-manager
    # Run as the invoking user so files the app writes into the mounted
    # commands_to_run/ (tag plans, proposals, exports) stay owned by you
    # instead of root.
    # The access code under ./data is chmod 0600 by the app itself, so it is
    # still only readable by this uid.
    user: "${UID:-1000}:${GID:-1000}"
    # The host's journal files are root:systemd-journal with an ACL granting the
    # `adm` group; without this the Logs module cannot read them at all. The
    # host user is already in adm, so this grants the container the same read
    # the invoking user already has. gid 4 is adm on Debian/Ubuntu.
    group_add:
      - "4"
    pid: host
    # docker-default's D-Bus rule denies nmcli's system-bus handshake with
    # "An AppArmor policy prevents this sender from sending this message", so
    # profile activation can never succeed under the default profile. This
    # loosens a security boundary: the container keeps pid: host and
    # network_mode: host anyway, so confinement is already partial. Drop this
    # line and NetworkManager actions go back to failing closed.
    security_opt:
      - apparmor=unconfined
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /etc:/host/etc:ro
      - /run/user:/run/user:ro
      - /var/run/dbus:/var/run/dbus:ro
      - /sys/class/dmi:/sys/class/dmi:ro
      # The host's package database and apt indexes, for the read-only
      # Packages module. The container's own dpkg database is the image's ~140
      # packages, not the host's ~2700, so the host's is what has to be read.
      # Both are ro: the module only ever parses them, and it renders the
      # commands to run rather than running them.
      - /var/lib/dpkg:/host/var/lib/dpkg:ro
      - /var/lib/apt/lists:/host/var/lib/apt/lists:ro
      # The host's journal, for the read-only Logs module. journalctl has to be
      # pointed at it with --root: the container's own journal is empty and its
      # machine-id is the image's, so a bare journalctl reads the wrong thing.
      - /var/log/journal:/host/var/log/journal:ro
      # Holds the access code and the audit/inventory databases. Override this
      # line to store them somewhere else; the container needs it to be writable
      # or no one can log in.
      - ./data:/data
      # The Folder Organizer module reads its scan JSON from ./data (mounted
      # above) and hands tag and folder-fix proposals back through
      # ./commands_to_run, which the host-side scripts then apply.
      - ./commands_to_run:/app/commands_to_run
    environment:
      # Auth is on unless a local .env explicitly opts out. Compose reads .env
      # from this directory for interpolation, so dropping DISABLE_AUTH=1 in
      # there still works, but a missing or untracked .env can never silently
      # expose the dashboard. Nothing is contacted without a session.
      - DISABLE_AUTH=${DISABLE_AUTH:-0}
      - HOST_ROOT=/host
      # Scan JSON lives in the ./data mount above, not in the image.
      - ORGANIZER_DATA_DIR=/data
      # The socket is mounted from the host at /var/run/dbus, and /var/run is a
      # symlink to /run inside the image, so the path nmcli must use is
      # /run/dbus/system_bus_socket. The old /host/run/dbus/... value pointed
      # into a prefix that only carries /proc, /sys and /etc -- nothing under
      # /host/run exists, so the address never resolved.
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
      - SYSTEM_MANAGER_AUTH_TOKEN_PATH=${SYSTEM_MANAGER_AUTH_TOKEN_PATH:-/data/access-code}
    cap_add:
      - SYS_ADMIN
      - SYS_RESOURCE
      - NET_ADMIN
      - CAP_DAC_READ_SEARCH
    restart: unless-stopped